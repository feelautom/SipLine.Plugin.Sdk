name: Publish SDK & Testing

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Registries
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.316'
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GH_TOKEN_DIRECT }}

      - name: Validate Release Tag
        shell: pwsh
        run: |
          $version = (Get-Content sipline-sdk-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid stable SDK version: $version"
          }
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match SDK version $version"
          }
          "SDK_VERSION=$version" >> $env:GITHUB_ENV

      # --- Build & Pack SDK ---
      - name: Restore SDK
        run: dotnet restore SipLine.Plugin.Sdk.csproj

      - name: Build SDK
        run: dotnet build SipLine.Plugin.Sdk.csproj --configuration Release --no-restore

      - name: Pack SDK
        run: dotnet pack SipLine.Plugin.Sdk.csproj --configuration Release --no-build -o out

      # --- Build & Pack Testing Lib ---
      - name: Restore Testing Lib
        run: dotnet restore SipLine.Plugin.Testing/SipLine.Plugin.Testing.csproj

      - name: Build Testing Lib
        run: dotnet build SipLine.Plugin.Testing/SipLine.Plugin.Testing.csproj --configuration Release --no-restore

      - name: Pack Testing Lib
        run: dotnet pack SipLine.Plugin.Testing/SipLine.Plugin.Testing.csproj --configuration Release --no-build -o out

      - name: Verify Package Set
        shell: pwsh
        run: |
          $expected = @(
            "out/SipLine.Plugin.Sdk.$env:SDK_VERSION.nupkg",
            "out/SipLine.Plugin.Testing.$env:SDK_VERSION.nupkg"
          )
          $actual = @(Get-ChildItem out -Filter *.nupkg -File)
          if ($actual.Count -ne $expected.Count) {
            throw "Expected exactly two packages, found $($actual.Count)."
          }
          foreach ($package in $expected) {
            if (-not (Test-Path -LiteralPath $package)) {
              throw "Missing expected package: $package"
            }
          }

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $authConfig = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "nuget.config"
          if (-not (Test-Path -LiteralPath $authConfig)) {
            throw "The authenticated GitHub Packages NuGet configuration was not generated."
          }
          dotnet nuget push "out/SipLine.Plugin.Sdk.$env:SDK_VERSION.nupkg" --configfile $authConfig
          dotnet nuget push "out/SipLine.Plugin.Testing.$env:SDK_VERSION.nupkg" --configfile $authConfig

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "The NUGET_API_KEY secret is required for a public release."
          }
          dotnet nuget push "out/SipLine.Plugin.Sdk.$env:SDK_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json"
          dotnet nuget push "out/SipLine.Plugin.Testing.$env:SDK_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json"
